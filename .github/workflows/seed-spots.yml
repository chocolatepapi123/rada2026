name: Seed spots (free gosom scraper, no Apify)

# ── When it runs ──────────────────────────────────────────────────────────────
# 1. schedule          : every day at 06:15 UTC — kicks off a fresh chain.
# 2. workflow_run      : right after "Test gosom Google Maps scraper" finishes — the seed prompt.
#                        Only a SUCCESSFUL test run seeds.
# 3. workflow_dispatch : manual retry, a one-off with the overrides below, or the CHAIN itself.
#
# ── The chain (seed → seed) ───────────────────────────────────────────────────
# When a seed run finishes successfully, it dispatches the NEXT seed run immediately, with the
# NEXT category in the rotation. Each successive run therefore uses a different category,
# walking the app's 17 categories in order. The chain is BOUNDED: it stops after `chain_length`
# runs (default 17 = one full rotation), so it can never loop forever.
#
#   chain_step   0-based position in the chain (blank = start a new chain at step 0)
#   chain_length how many runs the chain may contain (default 17)
#   chain_id     opaque tag so the run summary shows which chain a run belongs to
#
# A guard step refuses to start a NEW chain while another run of this workflow is still
# in progress or queued, so the daily schedule cannot stack chains on top of each other.
# A run that FAILED does not chain onward — a broken pipeline must not cascade 17 failures.
#
# ── The fixed seed prompt ─────────────────────────────────────────────────────
#   location : Nairobi, Thika Road, Kiambu (always) — each widened with nearby sub-areas
#              that are searched on Google Maps but FILED under the parent place, so the
#              three places actually reach 15 spots each instead of hitting a supply ceiling.
#   category : exactly ONE category per run, advancing one step per run through the app's 17
#              categories (scripts/seed-next-category.mjs — same order as src/lib/spotCategories.ts)
#   spots    : at least 15 per place
#   dry run  : OFF — every run writes the places to Supabase
#
# Set the repository variable ROTATION_CATEGORY_TODAY=YYYY-MM-DD to pin the rotation to that
# date for the day (useful for a deterministic retry).

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_run:
    workflows: ['Test gosom Google Maps scraper (writes nothing to your database)']
    types: [completed]
  workflow_dispatch:
    inputs:
      areas:
        description: 'OVERRIDE. Blank = fixed prompt (Nairobi; Thika Road; Kiambu + nearby sub-areas). Format: Name or Search|Label separated by ;'
        type: string
        default: ''
      categories:
        description: 'OVERRIDE. Blank = the rotation category for this chain step. Comma separated exact names.'
        type: string
        default: ''
      min_spots_per_place:
        description: 'OVERRIDE. Spots each place must end up with (blank = 15)'
        type: string
        default: ''
      chain_step:
        description: 'CHAIN. 0-based position in the chain. Blank = start a new chain at step 0.'
        type: string
        default: ''
      chain_length:
        description: 'CHAIN. How many runs the chain may contain (blank = 17 = one full rotation).'
        type: string
        default: ''
      chain_id:
        description: 'CHAIN. Opaque tag for this chain (blank = generated).'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: seed-spots
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Did the seed prompt succeed? ─────────────────────────────────────
      - name: Check the seed prompt
        id: check
        env:
          EVENT_NAME_IN: ${{ github.event_name }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME_IN" = "workflow_run" ] && [ "$EVENT_CONCLUSION" != "success" ]; then
            echo "::notice title=Seed skipped::The scraper test finished '$EVENT_CONCLUSION', so nothing was seeded."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # ── 2. Chain bookkeeping: is this a new chain, and may it start? ────────
      - name: Resolve the chain position
        id: chain
        if: ${{ steps.check.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_STEP: ${{ inputs.chain_step }}
          IN_LENGTH: ${{ inputs.chain_length }}
          IN_ID: ${{ inputs.chain_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          step="${IN_STEP//[[:space:]]/}"
          length="${IN_LENGTH//[[:space:]]/}"
          chain_id="${IN_ID//[[:space:]]/}"

          if [ -z "$length" ]; then length=17; fi
          if ! [[ "$length" =~ ^[0-9]+$ ]] || [ "$length" -lt 1 ]; then
            echo "::error title=Bad chain_length::'$length' is not a whole number >= 1"; exit 1
          fi

          if [ -z "$step" ]; then
            # A brand-new chain. Refuse to start one while another run is still going,
            # so the daily schedule cannot stack chains on top of each other.
            step=0
            busy=$(gh run list --workflow=seed-spots.yml --limit 20 \
                     --json databaseId,status \
                     --jq "[.[] | select(.databaseId != $RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\"))] | length" \
                     2>/dev/null || echo 0)
            if [ "${busy:-0}" -gt 0 ]; then
              echo "::notice title=Seed skipped::Another seed run is still in progress, so this one will not start a second chain."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$chain_id" ]; then chain_id="$(date -u +%Y%m%dT%H%M%SZ)"; fi
            echo "Starting a new chain $chain_id of up to $length run(s)."
          else
            if ! [[ "$step" =~ ^[0-9]+$ ]]; then
              echo "::error title=Bad chain_step::'$step' is not a whole number"; exit 1
            fi
            if [ -z "$chain_id" ]; then chain_id="unknown"; fi
            echo "Continuing chain $chain_id at step $step of $length."
          fi

          if [ "$step" -ge "$length" ]; then
            echo "::notice title=Chain complete::Step $step is past the chain length $length, so nothing more is seeded."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "run=true"
            echo "step=$step"
            echo "length=$length"
            echo "chain_id=$chain_id"
          } >> "$GITHUB_OUTPUT"

      # ── 3. Resolve the fixed seed prompt (or the manual overrides) ──────────
      - name: Resolve what this run seeds
        id: plan
        if: ${{ steps.chain.outputs.run == 'true' }}
        env:
          MANUAL_AREAS: ${{ inputs.areas }}
          MANUAL_CATEGORIES: ${{ inputs.categories }}
          MANUAL_MIN: ${{ inputs.min_spots_per_place }}
          PINNED_DAY: ${{ vars.ROTATION_CATEGORY_TODAY }}
          CHAIN_STEP: ${{ steps.chain.outputs.step }}
          CHAIN_LENGTH: ${{ steps.chain.outputs.length }}
          CHAIN_ID: ${{ steps.chain.outputs.chain_id }}
        run: |
          set -euo pipefail

          # The three places, each widened with nearby sub-areas. "Search|Label" means:
          # search Google Maps for the sub-area, but FILE the spot under the parent place —
          # so Nairobi / Thika Road / Kiambu each reach 15 instead of running dry.
          if [ -n "${MANUAL_AREAS//[[:space:]]/}" ]; then
            areas="$MANUAL_AREAS"
          else
            areas='Nairobi|Nairobi; Westlands|Nairobi; Kilimani|Nairobi; Thika Road|Thika Road; Ruiru|Thika Road; Juja|Thika Road; Kiambu|Kiambu; Ruaka|Kiambu'
          fi

          if [ -n "${MANUAL_MIN//[[:space:]]/}" ]; then
            min_spots="$MANUAL_MIN"
          else
            min_spots=15
          fi
          if ! [[ "$min_spots" =~ ^[0-9]+$ ]] || [ "$min_spots" -lt 1 ]; then
            echo "::error title=Bad min_spots_per_place::'$min_spots' is not a whole number >= 1"; exit 1
          fi

          if [ -n "${MANUAL_CATEGORIES//[[:space:]]/}" ]; then
            categories="$MANUAL_CATEGORIES"
            echo "Category: manual override"
          else
            rotation_day="${PINNED_DAY//[[:space:]]/}"
            if [ -z "$rotation_day" ]; then rotation_day=$(date -u +%Y-%m-%d); fi
            base_index=$(node scripts/seed-next-category.mjs --date="$rotation_day" --index)
            total=$(node scripts/seed-next-category.mjs --all | wc -l | tr -d ' ')
            index=$(( (base_index + CHAIN_STEP) % total ))
            categories=$(node scripts/seed-next-category.mjs --all | sed -n "$((index + 1))p")
            echo "Category: rotation for $rotation_day, chain step $CHAIN_STEP -> index $index of $total"
          fi

          echo "Places: $areas"
          echo "Category: $categories"
          echo "Min per place: $min_spots"

          {
            echo "areas=$areas"
            echo "categories=$categories"
            echo "min_spots=$min_spots"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Seed prompt"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Location | ${areas//;/,} |"
            echo "| Category | $categories |"
            echo "| Spots per place | at least $min_spots |"
            echo "| Mode | live (writes to Supabase) |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Chain | $CHAIN_ID — step $CHAIN_STEP of $CHAIN_LENGTH |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 4. Seed (live) ──────────────────────────────────────────────────────
      - name: Seed spots
        id: seed
        if: ${{ steps.plan.outputs.areas != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AREAS: ${{ steps.plan.outputs.areas }}
          CATEGORIES: ${{ steps.plan.outputs.categories }}
          # add_count 0 + target = min_spots => top each place up to 15 for this category.
          # A rerun the same day only adds the shortfall; it never overshoots.
          ADD_COUNT: '0'
          TARGET: ${{ steps.plan.outputs.min_spots }}
          # Never a dry run: every run must actually save the places.
          DRY_RUN: 'false'
          DEPTH: '2'
          STRICT: 'true'
          MAX_DEPTH: '4'
          MAX_PHOTOS: '5'
          # Widened from 20 to 3 so the three places are not capped by a thin supply of
          # heavily-reviewed venues. The app still needs 3+ photos per spot (MIN_PHOTOS).
          MIN_REVIEWS: '3'
          RELAX_FALLBACK: 'true'
        run: |
          set -euo pipefail
          SCRIPT=$(git ls-files | grep -m1 'seed-spots\.mjs$' || true)
          if [ -z "$SCRIPT" ]; then echo "seed-spots.mjs is not committed to the repo"; exit 1; fi
          echo "Running $SCRIPT"
          node "$SCRIPT"

      # ── 5. Gate: 15 spots per place, and show exactly what landed ───────────
      - name: Check the result (15 spots per place)
        if: ${{ steps.plan.outputs.areas != '' }}
        env:
          MIN_SPOTS_OUT: ${{ steps.plan.outputs.min_spots }}
        run: |
          set -euo pipefail
          LATEST=$(ls -1t seed-runs/*.json 2>/dev/null | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "::error title=Nothing saved::The run finished without inserting a single spot (no seed-runs log was written)."
            exit 1
          fi
          echo "Run log: $LATEST"
          node scripts/check-seed-run.mjs "$LATEST" "$MIN_SPOTS_OUT"

      # ── 6. Persist the run log ──────────────────────────────────────────────
      - name: Save the run log
        if: ${{ always() && steps.plan.outputs.areas != '' }}
        run: |
          if [ -n "$(git status --porcelain seed-runs 2>/dev/null)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add seed-runs
            git commit -m "Seed run log"
            git pull --rebase --autostash || true
            git push || true
          fi

      # ── 7. Chain: start the next seed run with the NEXT category ────────────
      - name: Start the next seed run (next category)
        if: ${{ always() && steps.chain.outputs.run == 'true' && steps.seed.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_STEP: ${{ steps.chain.outputs.step }}
          CHAIN_LENGTH: ${{ steps.chain.outputs.length }}
          CHAIN_ID: ${{ steps.chain.outputs.chain_id }}
          MANUAL_AREAS: ${{ inputs.areas }}
          MANUAL_MIN: ${{ inputs.min_spots_per_place }}
        run: |
          set -euo pipefail

          next=$(( CHAIN_STEP + 1 ))
          if [ "$next" -ge "$CHAIN_LENGTH" ]; then
            echo "::notice title=Chain finished::Step $CHAIN_STEP was the last of $CHAIN_LENGTH — the rotation is complete, so no further run is started."
            exit 0
          fi

          echo "Dispatching chain $CHAIN_ID step $next of $CHAIN_LENGTH (next category)."
          gh workflow run seed-spots.yml --ref main \
            -f chain_step="$next" \
            -f chain_length="$CHAIN_LENGTH" \
            -f chain_id="$CHAIN_ID" \
            -f areas="$MANUAL_AREAS" \
            -f min_spots_per_place="$MANUAL_MIN"
