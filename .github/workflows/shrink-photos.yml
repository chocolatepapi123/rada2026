name: Shrink stored photos (saves download quota)

# Makes the big photos in Supabase Storage smaller. Same file names, so no link changes.
# Start with Dry run ON (default): it tests a sample and prints the expected saving, writes nothing.
# Then run it again with Dry run OFF. Each run does up to "max_files" photos, so run it a few times until it says 0 left.
# Originals of every changed photo are kept for 14 days as a download under "Artifacts" on the run page.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run = test a sample and show the saving, change nothing'
        type: boolean
        default: true
      max_files:
        description: 'How many photos to shrink in this run (0 = all)'
        type: string
        default: '600'
      prefix:
        description: 'Only this folder in the bucket, e.g. spots (blank = everything)'
        type: string
        default: ''
      min_kb:
        description: 'Only photos bigger than this many KB'
        type: string
        default: '150'

jobs:
  shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install image library
        run: npm install --no-save sharp@0.34

      - name: Remember which photos are already done
        uses: actions/cache@v4
        with:
          path: shrink-photos-done.json
          key: shrink-done-${{ github.run_id }}
          restore-keys: shrink-done-

      - name: Shrink photos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_FILES: ${{ inputs.max_files }}
          PREFIX: ${{ inputs.prefix }}
          MIN_KB: ${{ inputs.min_kb }}
        run: node scripts/shrink-photos.mjs

      - name: Keep the originals for 14 days
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: original-photos-${{ github.run_id }}
          path: photo-backup
          retention-days: 14
          if-no-files-found: ignore
