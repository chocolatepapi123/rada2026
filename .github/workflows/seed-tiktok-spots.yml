name: Seed TikTok RADA Spots

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Start at query number'
        default: '0'
      limit:
        description: 'How many queries to run'
        default: '80'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QUERY_OFFSET: ${{ inputs.offset }}
          QUERY_LIMIT: ${{ inputs.limit }}
        run: npx tsx scripts/scrapeTikTokSpots.ts
