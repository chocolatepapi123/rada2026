name: Copy edge functions to the new Supabase project

# Deploys the 7 edge functions saved in this repo (supabase/functions/*) to the NEW project.
# Their code was copied out of the old project, so this needs NO access to the old project.
# mirror-spot-photos is deliberately NOT included (it would refill Supabase storage; photos live in R2).
#
# Repository secret needed: SUPABASE_ACCESS_TOKEN
#   (supabase.com/dashboard/account/tokens, made while logged into the account that owns the NEW project)
# Run it AFTER the database copy. Secret VALUES cannot be copied; the log lists the names to set.

on:
  workflow_dispatch:
    inputs:
      new_ref:
        description: 'NEW project ref (the part before .supabase.co)'
        type: string
        default: 'pvgfazctvxwlapalugdr'

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the functions from the repo to the new project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEW_REF: ${{ inputs.new_ref }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first."; exit 1; fi
          if [ "$NEW_REF" = "yobauhydhkptiuwvrntm" ]; then echo "::error::That is the OLD project ref. Use the new one."; exit 1; fi
          if ! supabase functions list --project-ref "$NEW_REF" >/dev/null 2>&1; then
            echo "::error title=Cannot reach the NEW project::The token cannot see project $NEW_REF. Create it while logged into the account that owns the new project, and check new_ref."; exit 1
          fi
          [ -d supabase/functions ] || { echo "::error::supabase/functions is missing from the repo. Upload the functions zip first."; exit 1; }
          [ -f supabase/config.toml ] || printf 'project_id = "rada"\n' > supabase/config.toml

          declare -A JWT=( [mpesa-stk-push]=yes [mpesa-callback]=no [seed-cinemas]=no [sync-events]=no \
                           [spot-details-extract]=no [ticket-payout-result]=no [ticket-payout]=no )
          failed=0
          for s in "${!JWT[@]}"; do
            echo "▶ $s"
            if [ ! -f "supabase/functions/$s/index.ts" ]; then echo "  ✖ supabase/functions/$s/index.ts is missing"; failed=1; continue; fi
            flag=""; [ "${JWT[$s]}" = "no" ] && flag="--no-verify-jwt"
            if supabase functions deploy "$s" --project-ref "$NEW_REF" --use-api --yes $flag; then echo "  ✔ deployed"; else echo "  ✖ deploy failed"; failed=1; fi
          done
          echo
          echo "Functions now on the new project:"
          supabase functions list --project-ref "$NEW_REF" || true
          echo
          echo "Secrets these functions read (set the values on the new project; SUPABASE_* ones are automatic):"
          grep -rhoE 'Deno\.env\.get\(["'"'"'][A-Z0-9_]+["'"'"']\)' supabase/functions | sed -E 's/.*\(["'"'"']([A-Z0-9_]+)["'"'"']\)/\1/' | sort -u | grep -v '^SUPABASE_' | sed 's/^/  - /'
          exit $failed
