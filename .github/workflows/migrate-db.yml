name: Migrate database to the new Supabase project

# Phase 16. Copies the whole RADA database (tables, data, functions, policies, triggers, accounts,
# scheduled jobs, bucket settings) from the OLD Supabase project to a NEW, empty one.
#
# Repository secrets needed:
#   OLD_DB_URL            old project > Connect > "Session pooler" URI (password filled in)
#   NEW_DB_URL            new project > Connect > "Session pooler" URI (password filled in)
#   NEW_SERVICE_ROLE_KEY  (optional) new project's service_role / secret key, only used if a cron job holds a key
#
# 1) Run with dry_run ON: it only checks both connections and prints what the old database holds.
# 2) Run with dry_run OFF and confirm = MIGRATE.
# Not copied: files in Storage (they are re-created in R2), edge functions and their secrets (next phase).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check connections only, change nothing'
        type: boolean
        default: true
      confirm:
        description: 'Type MIGRATE to allow the real copy'
        type: string
        default: ''
      force:
        description: 'Allow copying into a NEW project that already has tables (use after a failed run)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 6 --retry-all-errors --retry-delay 4 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-17
          pg_dump --version

      - name: Check the confirmation
        if: ${{ inputs.dry_run != true && inputs.confirm != 'MIGRATE' }}
        run: |
          echo "::error title=Not confirmed::Type MIGRATE in the confirm box to run the real copy."
          exit 1

      - name: Migrate
        env:
          OLD_DB_URL: ${{ secrets.OLD_DB_URL }}
          NEW_DB_URL: ${{ secrets.NEW_DB_URL }}
          NEW_SERVICE_ROLE_KEY: ${{ secrets.NEW_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: bash scripts/migrate/migrate-db.sh
