name: Seed spots (non-stop, 10 per place per category)

# Seeds one category across every place, then starts itself again on the next category. Never stops.
# Start it once with "Run workflow" (untick dry run). Dry runs preview only and do not loop.

on:
  workflow_dispatch:
    inputs:
      index:
        description: 'Category number to start at, 0 to 16 (empty = pick by day)'
        default: ''
      target:
        description: 'Spots each place should have per category'
        default: '10'
      dry_run:
        description: 'Dry run (preview only, saves nothing, does not loop)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: seed-spots
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install tools (sharp, R2 client, OpenCV, face model)
        run: |
          npm install --no-save --no-audit --no-fund sharp @aws-sdk/client-s3
          pip install --quiet opencv-python-headless
          mkdir -p models
          curl -fsSL -o models/yunet.onnx \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx

      - name: Pick the category
        id: plan
        env:
          IN_INDEX: ${{ inputs.index }}
        run: |
          IDX="$IN_INDEX"; [ -z "$IDX" ] && IDX="$(node scripts/seed-next-category.mjs --index)"
          TOTAL="$(node scripts/seed-next-category.mjs --all | wc -l)"
          CAT="$(node scripts/seed-next-category.mjs --all | sed -n "$((IDX % TOTAL + 1))p")"
          { echo "category=$CAT"; echo "next=$(( (IDX + 1) % TOTAL ))"; } >> "$GITHUB_OUTPUT"
          echo "Category $IDX: $CAT"

      - name: Seed every place for this category
        id: seed
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          CATEGORIES: ${{ steps.plan.outputs.category }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET: ${{ inputs.target || '10' }}
          SEED_RESULT_FILE: ${{ runner.temp }}/seed-result.txt
          STRICT: 'true'
          FACE_FILTER: 'true'
        run: |
          FAILED=0
          while IFS= read -r BATCH; do
            AREAS="$BATCH" node scripts/seed-spots.mjs || FAILED=1
          done < <(node scripts/seed-area-batches.mjs)
          exit $FAILED

      - name: Refresh spots.json in R2 (the file the PWA loads)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
        run: node scripts/export-spots.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-runs
          path: seed-runs/
          if-no-files-found: ignore

      - name: Start the next category
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEXT: ${{ steps.plan.outputs.next }}
          TARGET: ${{ inputs.target || '10' }}
          OUTCOME: ${{ steps.seed.outcome }}
        run: |
          # Short pause so a blocked scraper or an all-full lap never spins at full speed.
          if [ "$OUTCOME" = "success" ]; then sleep 30; else sleep 300; fi
          gh workflow run seed-daily.yml -f index="$NEXT" -f target="$TARGET" -f dry_run=false
