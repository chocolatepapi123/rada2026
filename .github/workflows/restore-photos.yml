name: Restore spot photos to R2

# Copies every spot photo into the Cloudflare R2 bucket and points the new Supabase project at it.
# Run with dry run ON first, check the log, then run again with dry run OFF.
#
# Repository secrets needed:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_URL
#   SUPABASE_URL (NEW project), SUPABASE_SERVICE_ROLE_KEY (NEW project)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: list what would be copied, change nothing'
        type: boolean
        default: true
      auto_repeat:
        description: 'Keep starting new runs by itself until every spot is done (real runs only)'
        type: boolean
        default: true
      runs_left:
        description: 'Safety limit: how many more runs it may start by itself'
        type: string
        default: '40'
      prev_waiting:
        description: 'Leave empty. Used by the auto-repeat to spot a run that made no progress'
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: restore-photos
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      NEW_REF: pvgfazctvxwlapalugdr
      OLD_REF: yobauhydhkptiuwvrntm
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets and files before doing anything
        run: |
          set -uo pipefail
          bad=0
          for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            val="${!v-}"
            if [ -z "$val" ]; then echo "::error title=Missing secret::$v is empty or not saved. Check the name is spelled exactly like this."; bad=1; continue; fi
            if [ "$val" != "$(printf '%s' "$val" | tr -d '[:space:]')" ]; then echo "::error title=Stray space::$v has a space or line break in it. Save it again."; bad=1; fi
          done
          [ "$bad" = 1 ] && exit 1

          if ! printf '%s' "$R2_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error title=R2_ACCOUNT_ID::It should be 32 letters and digits (the code right after dash.cloudflare.com/ in the address bar)."; bad=1; fi
          if [ "${#R2_ACCESS_KEY_ID}" != 32 ]; then
            echo "::error title=R2_ACCESS_KEY_ID::The Access Key ID is 32 characters long, but this one is ${#R2_ACCESS_KEY_ID}. The 64-character one is the Secret Access Key. They may be swapped."; bad=1; fi
          if [ "${#R2_SECRET_ACCESS_KEY}" != 64 ]; then
            echo "::error title=R2_SECRET_ACCESS_KEY::The Secret Access Key is 64 characters long, but this one is ${#R2_SECRET_ACCESS_KEY}. The 32-character one is the Access Key ID. They may be swapped."; bad=1; fi
          case "$R2_PUBLIC_URL" in https://*) ;; *) echo "::error title=R2_PUBLIC_URL::It must start with https://"; bad=1;; esac
          case "$R2_PUBLIC_URL" in */) echo "::error title=R2_PUBLIC_URL::Remove the / at the end."; bad=1;; esac
          if [ "$R2_BUCKET" != "rada-media" ]; then echo "::warning title=R2_BUCKET::Expected rada-media but found a different name."; fi
          case "$SUPABASE_URL" in *"$OLD_REF"*) echo "::error title=SUPABASE_URL::This points at the OLD project. It must be https://$NEW_REF.supabase.co"; bad=1;; esac
          if [ "$SUPABASE_URL" != "https://$NEW_REF.supabase.co" ]; then
            echo "::error title=SUPABASE_URL::It must be exactly https://$NEW_REF.supabase.co (no slash at the end)."; bad=1; fi

          if printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | grep -q '^eyJ'; then
            ref=$(python3 - <<'PY'
          import os, base64, json
          try:
              p = os.environ["SUPABASE_SERVICE_ROLE_KEY"].split(".")[1]
              p += "=" * (-len(p) % 4)
              d = json.loads(base64.urlsafe_b64decode(p))
              print(d.get("ref", "") + "|" + d.get("role", ""))
          except Exception:
              print("|")
          PY
            )
            kref="${ref%%|*}"; krole="${ref##*|}"
            if [ -n "$kref" ] && [ "$kref" != "$NEW_REF" ]; then echo "::error title=SUPABASE_SERVICE_ROLE_KEY::This key belongs to a different project ($kref). Copy the key from the NEW project."; bad=1; fi
            if [ -n "$krole" ] && [ "$krole" != "service_role" ]; then echo "::error title=SUPABASE_SERVICE_ROLE_KEY::This is the $krole key. Use the service_role key."; bad=1; fi
          fi

          if [ ! -f scripts/migrate/restore-photos.mjs ]; then
            echo "::error title=Script missing::scripts/migrate/restore-photos.mjs is not in the repo. Upload phase15.zip first."; bad=1
          elif ! grep -q "/rada-media/spots/" scripts/migrate/restore-photos.mjs; then
            echo "::warning title=Old script?::restore-photos.mjs does not contain /rada-media/spots/. It may be an older version."
          fi
          [ "$bad" = 1 ] && exit 1

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/photo_manifest?select=status&limit=1")
          if [ "$code" != "200" ]; then
            echo "::error title=New project not reachable::photo_manifest check returned HTTP $code. 401/403 = wrong key, 404 = table missing, 000 = wrong URL."; exit 1
          fi
          echo "✔ Secrets look right and the new project answers."

      - name: Install the R2 uploader
        run: |
          set -euo pipefail
          # Installed in its own folder so the app's Vite/esbuild versions can never block it.
          mkdir -p "$RUNNER_TEMP/r2tools"
          cd "$RUNNER_TEMP/r2tools"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts @aws-sdk/client-s3
          cd "$GITHUB_WORKSPACE"
          rm -rf node_modules
          ln -s "$RUNNER_TEMP/r2tools/node_modules" node_modules
          node --input-type=module -e "import '@aws-sdk/client-s3'; console.log('✔ uploader installed')"

      - name: Test R2 access before copying anything
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { S3Client, HeadBucketCommand, ListObjectsV2Command, PutObjectCommand, DeleteObjectCommand } from '@aws-sdk/client-s3';
          const B = process.env.R2_BUCKET;
          const c = new S3Client({
            region: 'auto',
            endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
            credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID, secretAccessKey: process.env.R2_SECRET_ACCESS_KEY },
          });
          const key = `_write-test/${Date.now()}.txt`;
          const tests = [
            ['find the bucket', () => c.send(new HeadBucketCommand({ Bucket: B }))],
            ['list files', () => c.send(new ListObjectsV2Command({ Bucket: B, MaxKeys: 1 }))],
            ['write a file', () => c.send(new PutObjectCommand({ Bucket: B, Key: key, Body: 'ok', ContentType: 'text/plain' }))],
            ['delete the test file', () => c.send(new DeleteObjectCommand({ Bucket: B, Key: key }))],
          ];
          const ok = {};
          for (const [name, fn] of tests) {
            try { await fn(); ok[name] = true; console.log('  ✔ can ' + name); }
            catch (e) { ok[name] = false; console.log('  ✖ cannot ' + name + ': ' + (e.name || '') + ' ' + (e.message || '')); }
          }
          if (!ok['write a file']) {
            if (ok['list files']) {
              console.log('::error title=R2 token is read-only::The token can read the bucket but not write. Create a token with Object Read & Write.');
            } else {
              console.log('::error title=R2 refused the key::Cloudflare rejected the key completely. Check, in order: (1) R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY come from the SAME token, (2) that token is set to Object Read & Write for the bucket rada-media, (3) R2_ACCOUNT_ID is the account that owns rada-media, (4) R2_BUCKET is exactly rada-media.');
            }
            process.exit(1);
          }
          console.log('✔ R2 accepts uploads.');
          JS

      - name: Restore photos
        id: restore
        run: |
          set -euo pipefail
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry-run"; fi
          node scripts/migrate/restore-photos.mjs $args 2>&1 | tee "$RUNNER_TEMP/restore.log"
          left=$(grep -oE 'spots still waiting [0-9]+' "$RUNNER_TEMP/restore.log" | tail -1 | grep -oE '[0-9]+$' || true)
          echo "Spots still waiting after this run: ${left:-unknown}"
          echo "left=$left" >> "$GITHUB_OUTPUT"

      - name: Start the next run if spots are still waiting
        if: ${{ inputs.dry_run != true && inputs.auto_repeat && steps.restore.outputs.left != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LEFT: ${{ steps.restore.outputs.left }}
          PREV: ${{ inputs.prev_waiting }}
          RUNS_LEFT: ${{ inputs.runs_left }}
        run: |
          set -euo pipefail
          if [ "$LEFT" = "0" ]; then echo "✔ All spots are restored. Done."; exit 0; fi
          if [ -n "$PREV" ] && [ "$LEFT" -ge "$PREV" ]; then
            echo "::warning title=No progress::This run did not reduce the waiting count ($PREV before, $LEFT now). Stopping so it does not loop. Send me the log."; exit 0
          fi
          case "$RUNS_LEFT" in ''|*[!0-9]*) RUNS_LEFT=0;; esac
          if [ "$RUNS_LEFT" -le 0 ]; then echo "Safety limit reached. Run the workflow again to continue."; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          gh workflow run "$wf" --ref "$GITHUB_REF_NAME" -f dry_run=false -f auto_repeat=true \
            -f prev_waiting="$LEFT" -f runs_left="$((RUNS_LEFT - 1))"
          echo "▶ Next run started by itself ($LEFT spots still waiting, $((RUNS_LEFT - 1)) more runs allowed)."
