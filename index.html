<html lang="en" class="light">

    <meta charset="UTF-8" />

    <meta name="description" content="Discover Nairobi's best spots, events and movies, plan outings with new people, keep your tickets in one place and go out safely." />
    <meta property="og:title" content="RADA: Spots, Events & Outings in Nairobi" />
    <meta property="og:site_name" content="RADA" />
    <meta property="og:description" content="Discover Nairobi's best spots, events and movies, plan outings with new people, keep your tickets in one place and go out safely." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RADA: Spots, Events & Outings in Nairobi" />
    <meta name="twitter:description" content="Discover Nairobi's best spots, events and movies, plan outings with new people, keep your tickets in one place and go out safely." />
    
    <!-- Fonts + icons: loaded without blocking first paint (media=print swap), with a <noscript> fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
    </noscript>
    <!-- Leaflet is no longer loaded here. src/lib/leaflet.ts loads it the first time a map opens. -->
 <link rel="icon" type="image/png" href="/favicon.png" />
 <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
 <link rel="manifest" href="/manifest.json" />
<!-- Phone top bar and bottom gesture bar follow the PHONE's light/dark setting, not the in-app toggle. -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121113" media="(prefers-color-scheme: dark)" />
<script>
  /* App theme: light unless the person chose dark. Set before first paint so there is no dark flash.
     The phone bars are NOT affected; they follow the theme-color tags above. */
  try {
    var dark = localStorage.getItem('rada_theme') === 'dark';
    document.documentElement.classList.add(dark ? 'dark' : 'light');
  } catch (e) { document.documentElement.classList.add('light'); }
</script>
<script>
  /* Low-memory / data-saver phones get a lighter look (no blur effects), set before first paint. */
  try {
    var n = navigator, c = n.connection || {};
    if ((n.deviceMemory && n.deviceMemory <= 4) || (n.hardwareConcurrency && n.hardwareConcurrency <= 4) || c.saveData) {
      document.documentElement.classList.add('low-end');
    }
  } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RADA" />

  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
